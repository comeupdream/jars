<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>JARS // KOOLAID PINEAPPLE SPEARS</title>
<meta name="description" content="IT'S JUST PINEAPPLE. IN KOOLAID. IN A JAR." />
<link rel="icon" type="image/jpeg" href="assets/faviconmascot.jpg" />
<link rel="apple-touch-icon" href="assets/faviconmascot.jpg" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/os.css" />
<link rel="stylesheet" href="css/fx.css" />
</head>
<body>

  <!-- ===== BACKGROUND VIDEO (cropped top/bottom, replaces bubbles) ===== -->
  <video id="desktop-bg" class="desktop-bg" autoplay loop muted playsinline aria-hidden="true">
    <source src="assets/desktop-bg.mp4" type="video/mp4" />
  </video>

  <!-- ===== PROCEDURAL FX (transparent overlay for click bursts) ===== -->
  <canvas id="fx-bg" aria-hidden="true"></canvas>

  <!-- ===== BOOT / POST SCREEN ===== -->
  <div id="boot" class="boot">
    <pre id="boot-log" class="boot-log"></pre>
    <div id="boot-stage" class="boot-stage">
      <img id="boot-hero" class="boot-hero" src="assets/rainbowkool.jpg" alt="" hidden
           onerror="this.style.display='none'" />
      <video id="boot-video" class="boot-video" muted playsinline preload="auto" hidden>
        <source src="assets/koolaid-man.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="boot-bar" id="boot-bar" hidden>
      <div class="boot-bar__label">JARSOS</div>
      <div class="boot-bar__track"><div class="boot-bar__fill" id="boot-fill"></div></div>
      <div class="boot-bar__hint">do not turn off your jar</div>
    </div>
  </div>

  <!-- heavy wavy CRT displacement filter for the intro video -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true">
    <filter id="crtwave">
      <feTurbulence type="fractalNoise" baseFrequency="0 0.02" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" dur="5s" values="0 0.012; 0.005 0.035; 0 0.012" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" dur="2.4s" values="12;30;12" repeatCount="indefinite" />
      </feDisplacementMap>
    </filter>
  </svg>

  <!-- ===== DESKTOP ===== -->
  <main id="desktop" class="desktop" hidden>
    <div id="desktop-icons" class="desktop-icons"></div>

    <!-- all the banner text floating across the background -->
    <div class="bg-banners" id="bg-banners" aria-hidden="true"></div>

    <!-- windows get injected here -->
    <div id="window-layer" class="window-layer"></div>
  </main>

  <!-- ===== START MENU ===== -->
  <div id="start-menu" class="start-menu" hidden>
    <div class="start-menu__rail">JARS<span>OS</span></div>
    <ul class="start-menu__list" id="start-list"></ul>
  </div>

  <!-- ===== TASKBAR ===== -->
  <footer id="taskbar" class="taskbar" hidden>
    <button id="start-btn" class="start-btn">
      <span class="start-btn__logo">▦</span> START
    </button>
    <div id="tasks" class="tasks"></div>
    <div class="tray">
      <span id="tray-sip" class="tray__sip" title="sips remaining">🥤</span>
      <span id="clock" class="clock">--:--</span>
    </div>
  </footer>

  <!-- ===== CRT OVERLAY (scanlines + vignette, pure CSS) ===== -->
  <div class="crt" aria-hidden="true"></div>

  <!-- ===== MASCOT (purple kool-aid man helper) ===== -->
  <div id="mascot" class="mascot" hidden>
    <div class="mascot__bubble" id="mascot-bubble"></div>
    <img class="mascot__img" src="assets/faviconmascot.jpg" alt="Kool-Aid Man"
         onerror="this.onerror=null;this.src='assets/koolaid-man.svg'" />
  </div>

  <script src="js/buildinfo.js"></script>
  <script src="js/version.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/content.js"></script>
  <script src="js/games.js"></script>
  <script src="js/cursors.js"></script>
  <script src="js/os.js"></script>
</body>
</html>
